# Level 3C1-A: MINIMAL robust WAN video settings — CABIN only, for use over
# constrained/unreliable mobile Internet (ATT/Starlink field testing showed
# the full four-camera 800x600@20fps/4Mbps-per-camera mode is not reliable
# enough on the available uplink). This is a SEPARATE config from
# config/video.yaml — full mode is unchanged and still uses that file.
#
# Same encoder/mux/parser stability settings as full mode (poc-type=2,
# insert-sps-pps, explicit H.264 caps, mpegtsmux alignment=7, PAT/PMT
# intervals) — only resolution/framerate/bitrate/keyframe-interval differ,
# scaled down for robustness over a ~5 Mbps or lower uplink.

capture:
  # The current "HD USB Camera" units (six-camera rig, 2026-10-06) offer
  # 640x480 MJPG only at 30.000 fps (`v4l2-ctl --list-formats-ext`; 15 fps
  # exists only at 1280x960 and above): a 10 or 15 fps request fails caps
  # negotiation instantly (gst "not-negotiated"). The earlier cameras ran
  # 640x480 MJPG @ 10 fps natively. 30 fps is this camera's own discrete
  # mode, so still no rate-limiting GStreamer stage is needed.
  width: 640
  height: 480
  framerate: 30

encoder:
  # Target ~800 kbps nominal per Level 3C1-A section 5 (robustness over
  # quality — do not raise this because the image looks soft).
  bitrate: 800000
  # ~1 second IDR spacing at 30 FPS, so a late reader still attaches within
  # about a second (handoff doc §3). Keep these equal to the framerate.
  # Bitrate is unchanged, so bandwidth per camera stays ~800 kbps (each frame
  # gets fewer bits than at 10 fps: smoother but softer).
  idr_interval_frames: 30
  iframe_interval_frames: 30
  insert_sps_pps: true
  # Same Level 3B1-B3 fix as full mode — confirmed present on this installed
  # nvv4l2h264enc (range 0-2, default 0).
  poc_type: 2

h264parse:
  config_interval: -1
  stream_format: byte-stream
  alignment: au

mpegts:
  alignment: 7
  pat_interval_ticks: 9000
  pmt_interval_ticks: 9000

srt:
  pkt_size: 1316
  pbkeylen: 32
